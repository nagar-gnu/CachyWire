<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CachyWire Mini Viewer HUD</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/modals.css">
  <style>
    body {
      background: rgba(18, 22, 31, 0.96);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #mini-viewer-widget {
      position: static;
      display: flex;
      width: 100vw;
      height: 100vh;
      border: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="mini-viewer-widget"></div>

  <script type="module">
    import { MiniViewerWidget } from './src/presentation/mini-viewer.js';
    import { postNativeDesktopMessage } from './src/presentation/shell.js';

    const widget = new MiniViewerWidget({
      container: document.getElementById('mini-viewer-widget'),
      onRestoreMain: () => {
        postNativeDesktopMessage('restore_main');
      }
    });
    widget.mount();
    widget.open();

    // Hide close button inside standalone native HUD window or make it hide window
    const closeBtn = document.getElementById('mini-close-btn');
    if (closeBtn) {
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        postNativeDesktopMessage('hide_mini_viewer');
      });
    }

    document.body.addEventListener('dblclick', () => {
      postNativeDesktopMessage('restore_main');
    });

    // Stream authentic live CachyOS network telemetry (100% real sysRx & sysTx, Zero Math.random)
    setInterval(async () => {
      let sysRx = 0;
      let sysTx = 0;
      try {
        const resp = await fetch('/api/system/status');
        if (resp.ok) {
          const sys = await resp.json();
          if (sys.network) {
            sysRx = Number(sys.network.rxBytesPerSec) || 0;
            sysTx = Number(sys.network.txBytesPerSec) || 0;
          }
        }
      } catch {}

      widget.pushSample({ bytes_in: Math.max(0, sysRx), bytes_out: Math.max(0, sysTx) });
    }, 1000);
  </script>
</body>
</html>
